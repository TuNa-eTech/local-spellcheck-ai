[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soatvan-engine"
version = "0.1.11"
description = "Offline Vietnamese DOCX checking engine"
requires-python = ">=3.12"
dependencies = ["cryptography>=44,<47", "lxml>=5.3,<7"]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.130,<7",
    "jsonschema>=4.23,<5",
    "mypy>=1.15,<2",
    "pyinstaller>=6.12,<7",
    "psutil>=7,<8",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-psutil>=7,<8",
]
model = ["llama-cpp-python>=0.3.8,<1"]
seq2seq = [
    "protobuf>=3.20.0,<6",
    "sentencepiece>=0.2.0,<1",
    "torch>=2.0,<3",
    "transformers>=4.40,<5",
]

[project.scripts]
soatvan-engine = "soatvan.entrypoints.sidecar:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soatvan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["soatvan"]

[[tool.mypy.overrides]]
module = [
    "lxml.*",
    "torch.*",
    "transformers.*",
    "sentencepiece.*",
]
ignore_missing_imports = true
