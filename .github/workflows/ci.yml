name: verify

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: engine/uv.lock
      - name: Restore PyInstaller analysis cache
        uses: actions/cache@v4
        with:
          path: engine/build/soatvan-engine
          key: ${{ runner.os }}-${{ runner.arch }}-pyinstaller-${{ hashFiles('engine/uv.lock', 'engine/pyproject.toml', 'engine/soatvan-engine.spec', 'engine/src/**') }}
      - run: uv sync --project engine --extra dev --locked
      - run: uv run --project engine ruff check engine
      - run: uv run --project engine mypy --config-file engine/pyproject.toml
      - run: uv run --project engine pytest --cov=soatvan --cov-report=term-missing --cov-fail-under=85 engine
      - name: Build Python onedir
        working-directory: engine
        run: uv run pyinstaller --noconfirm soatvan-engine.spec
      - name: Run frozen sidecar acceptance without Python on PATH
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/windows-acceptance | Out-Null
          uv run --project engine python engine/tests/windows_frozen_acceptance.py `
            --engine engine/dist/soatvan-engine/soatvan-engine.exe `
            --artifacts artifacts/windows-acceptance
      - name: Generate advanced golden DOCX output
        shell: pwsh
        env:
          SOATVAN_ACCEPTANCE_OUTPUT: artifacts/windows-acceptance/golden-output.docx
        run: uv run --project engine pytest engine/tests/test_docx.py::test_golden_package_preserves_unsupported_parts_and_existing_annotations
      - name: Validate generated DOCX with Open XML SDK
        shell: pwsh
        run: |
          $documents = Get-ChildItem artifacts/windows-acceptance/*.docx
          dotnet run --project tools/OpenXmlValidator/OpenXmlValidator.csproj -- $documents.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: engine-windows-x64
          path: engine/dist/soatvan-engine/
      - uses: actions/upload-artifact@v4
        with:
          name: m0-m1-windows-docx-evidence
          path: artifacts/windows-acceptance/

  desktop:
    needs: engine
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-windows-x64
          path: apps/desktop/src-tauri/resources/engine/
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          workspaces: apps/desktop/src-tauri -> target
      - name: Cache Tauri Windows bundler tools
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: ${{ runner.os }}-tauri-bundler-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-tauri-bundler-
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: apps/desktop/package-lock.json }
      - run: npm ci
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop
      - run: cargo fmt --check
        working-directory: apps/desktop/src-tauri
      - run: cargo test
        working-directory: apps/desktop/src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: apps/desktop/src-tauri
      - name: Build offline NSIS installer
        run: npm run tauri build -- --bundles nsis
        working-directory: apps/desktop
        env:
          SOATVAN_MODEL_ENDPOINT: ${{ vars.SOATVAN_MODEL_ENDPOINT }}
          SOATVAN_MODEL_ALLOWLIST: ${{ vars.SOATVAN_MODEL_ALLOWLIST }}
          SOATVAN_MODEL_PUBLIC_KEY: ${{ vars.SOATVAN_MODEL_PUBLIC_KEY }}
      - name: Install, launch and verify process lifecycle without egress
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          ./scripts/test-windows-package.ps1 -InstallerPath $installer.FullName
      - name: Verify Authenticode when release certificate is configured
        if: ${{ vars.AUTHENTICODE_ENABLED == 'true' }}
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid signature: $($_.FullName)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: soatvan-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
